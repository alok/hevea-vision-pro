name: HeveaVision

options:
  bundleIdPrefix: com.alok
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  HeveaCore:
    path: Packages/HeveaCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HeveaVision:
    type: application
    platform: visionOS
    sources:
      - path: HeveaVision
    dependencies:
      - package: HeveaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alok.HeveaVision
        PRODUCT_NAME: HeveaVision
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_MODULE_NAME: HeveaVision
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hevea Vision
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "7"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - HeveaVisionTests
        - HeveaVisionUITests
      gatherCoverageData: true

  HeveaVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: HeveaVisionTests
    dependencies:
      - target: HeveaVision
      - package: HeveaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alok.HeveaVisionTests
        GENERATE_INFOPLIST_FILE: YES

  HeveaVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources:
      - path: HeveaVisionUITests
    dependencies:
      - target: HeveaVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alok.HeveaVisionUITests
        GENERATE_INFOPLIST_FILE: YES
