name: FareyVision
options:
  bundleIdPrefix: com.alok
  deploymentTarget:
    visionOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FareyVision:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: Packages/FareyCore/Sources/FareyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alok.FareyVision
        DEVELOPMENT_TEAM: 5795ZPYZ2T
        'CODE_SIGN_STYLE[sdk=xros*]': Manual
        'CODE_SIGN_IDENTITY[sdk=xros*]': Apple Development
        'PROVISIONING_PROFILE_SPECIFIER[sdk=xros*]': Lean Calculator Vision Pro 20261008
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farey — Into the Infinite
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 18
        MARKETING_VERSION: '0.14.0'
        TARGETED_DEVICE_FAMILY: '7'
    scheme:
      testTargets: [FareyVisionTests, FareyVisionUITests]
  FareyVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources: [Tests]
    dependencies:
      - target: FareyVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FareyVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources: [UITests]
    dependencies:
      - target: FareyVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
